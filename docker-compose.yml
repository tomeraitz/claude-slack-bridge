services:
  claude-slack-bridge:
    container_name: claude-slack-bridge
    build: .
    # BRIDGE_ENV_FILE lets the config live outside this tree — docs/homebrew.md
    env_file:
      - ${BRIDGE_ENV_FILE:-.env}
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GH_TOKEN=${GITHUB_TOKEN}
    volumes:
      # Mount the full Claude folder with read/write access
      - ${HOME}/.claude:/home/appuser/.claude:rw
      # Mount the user-scope MCP config file so global mcpServers
      # (notion, pencil, playwright) are available inside the container
      - ${HOME}/.claude.json:/home/appuser/.claude.json:rw
      # Mount all projects so claude -p can run from the correct project directory
      - ${PROJECTS_DIR}:/projects
      # The channel → project mapping: runtime config, so an edit needs no rebuild
      - ${PROJECTS_JSON:-./projects.json}:/app/projects.json:ro
    # "no" under `brew services`, so launchd is the only supervisor
    restart: ${RESTART_POLICY:-unless-stopped}
